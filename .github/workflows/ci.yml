# Ground station CI: lint with ruff, type-check with mypy and run the pytest
# suite on every push/PR.
# The Qt UI (app.py) isn't exercised yet; tests cover the uplink packet format
# in messages.py and only need QtCore, so no display is required.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: ruff check
        run: uv run --frozen ruff check --output-format github .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # PyQt6 ships its own stubs, so mypy needs the real deps installed
      - name: Install dependencies
        run: uv sync --frozen
      - name: mypy
        run: uv run --frozen mypy

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      # Python version comes from .python-version
      - name: Install dependencies
        run: uv sync --frozen
      - name: pytest
        run: uv run --frozen pytest -v
